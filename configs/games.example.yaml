# autosave-games configuration.
# Paths accept %VAR% (e.g. %APPDATA%, %USERPROFILE%) and a leading "~".
# Use forward slashes or single quotes: inside double quotes YAML treats "\" as an escape.

# Where archives are written: <backup_root>/<game-slug>/<time>_<kind>.zip
# Tip: point this at a OneDrive / Google Drive folder for free cloud sync.
backup_root: "%USERPROFILE%/GameBackups"

# Seconds between process checks.
poll_seconds: 3

# Desktop notifications: all | errors | none (write failures are always shown).
notify: errors

defaults:
  keep_last: 20       # archives kept per game (prerestore archives are never pruned)
  settle_seconds: 5   # how long the game must stay closed before the post backup

games: []
